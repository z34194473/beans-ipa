name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: false
        default: "Release"
  push:
    branches: [ main, master ]
    paths-ignore:
      - "**.md"
      - ".github/**"

env:
  SCHEME: Beans
  PROJECT: Beans.xcodeproj
  APP_NAME: Beans

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        env:
          CONFIG: ${{ github.event.inputs.configuration || 'Release' }}
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_BITCODE=NO \
            build | tee build.log | tail -n 120

      - name: Package IPA
        env:
          CONFIG: ${{ github.event.inputs.configuration || 'Release' }}
        run: |
          set -euo pipefail
          APP="build/Build/Products/${CONFIG}-iphoneos/${APP_NAME}.app"
          if [ ! -d "$APP" ]; then
            echo "::error::App bundle not found at $APP"
            ls -la "build/Build/Products/${CONFIG}-iphoneos" || true
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          # 去掉可能残留的签名，保证是干净的未签名包
          rm -rf Payload/*.app/_CodeSignature Payload/*.app/embedded.mobileprovision || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/*.app/Info.plist || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/*.app/Info.plist || true
          zip -qry "${APP_NAME}-unsigned.ipa" Payload
          ls -lh "${APP_NAME}-unsigned.ipa"
          shasum -a 256 "${APP_NAME}-unsigned.ipa" | tee sha256.txt

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: |
            ${{ env.APP_NAME }}-unsigned.ipa
            sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
